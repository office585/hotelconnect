name: HotelConnect Export

on:
  workflow_dispatch:
  schedule:
    - cron: "5 0 * * *"

jobs:
  hotelconnect-export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install chromium --with-deps

      - name: Run HotelConnect export
        env:
          HOTELCONNECT_EMAIL: ${{ secrets.HOTELCONNECT_EMAIL }}
          HOTELCONNECT_PASSWORD: ${{ secrets.HOTELCONNECT_PASSWORD }}
        run: |
          xvfb-run -a python hotelconnect_export.py
