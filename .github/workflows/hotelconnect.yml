name: HotelConnect Export

on:
  workflow_dispatch:
  schedule:
    - cron: "5 0 * * *"

jobs:
  hotelconnect-export:
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # REPOSITORY LETÖLTÉSE
      # ======================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # PYTHON SETUP
      # ======================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ======================================================
      # PYTHON CSOMAGOK TELEPÍTÉSE
      # ======================================================
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ======================================================
      # PLAYWRIGHT CHROMIUM TELEPÍTÉSE
      # ======================================================
      - name: Install Playwright Chromium
        run: |
          playwright install chromium --with-deps

      # ======================================================
      # ROBOT FUTTATÁSA
      # ======================================================
      - name: Run HotelConnect export
        env:
          HOTELCONNECT_EMAIL: ${{ secrets.HOTELCONNECT_EMAIL }}
          HOTELCONNECT_PASSWORD: ${{ secrets.HOTELCONNECT_PASSWORD }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          xvfb-run -a python hotelconnect_export.py
